# ============================================================
# Application Properties - Investment Portfolio Tracker
# ============================================================

spring.application.name=investment-portfolio-tracker
server.port=8081

# ============================================================
# DataSource - MySQL 8
# Replace the placeholders with your actual credentials.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# HikariCP Connection Pool Settings
# These keep resource usage low for a local/demo app.
# ============================================================
spring.datasource.hikari.pool-name=PortfolioHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# Disable Spring Boot's auto schema creation
# We manage schema.sql / data.sql manually.
# ============================================================
spring.sql.init.mode=never

# ============================================================
# Jackson - pretty-print JSON responses
# ============================================================
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ============================================================
# Logging
# ============================================================
logging.level.com.portfolio.tracker=DEBUG
logging.level.com.zaxxer.hikari=INFO
